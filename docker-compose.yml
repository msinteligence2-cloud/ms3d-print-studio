services:
  postgres:
    image: postgres:16-alpine
    container_name: ms3dprinting-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ms3dprinting
      POSTGRES_USER: ms3dprinting
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - ms3dprinting-postgres:/var/lib/postgresql/data
      - ./infra/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ms3dprinting -d ms3dprinting"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ms3dprinting-postgres:
